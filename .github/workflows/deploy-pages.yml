name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dynamic last-updated dates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-dates.mjs

      - name: Verify generated constants exist
        run: test -f js/constants.generated.js

      - name: Verify placeholder replacement sources
        run: |
          grep -q "class Constants" js/constants.js
          grep -q "PRIVACY_LAST_UPDATED" js/constants.generated.js
          grep -q "TERMS_LAST_UPDATED" js/constants.generated.js

  build:
    name: Package for Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dynamic last-updated dates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-dates.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test-summary:
    name: Test run summary
    needs: verify
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Print live URLs
        env:
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          BASE="https://${OWNER}.github.io/${NAME}"
          echo "## Published URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Page | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Home | ${BASE}/ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Privacy Policy | ${BASE}/privacy-policy.html |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terms & Conditions | ${BASE}/terms-and-conditions.html |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "_PR test run: build verified. Pages deploys after merge to main/master._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Site deployed via GitHub Pages (Actions source)._" >> "$GITHUB_STEP_SUMMARY"
          fi
