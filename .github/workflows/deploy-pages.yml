name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dynamic last-updated dates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-dates.mjs

      - name: Verify generated constants exist
        run: test -f js/constants.generated.js

      - name: Verify placeholder replacement sources
        run: |
          grep -q "class Constants" js/constants.js
          grep -q "PRIVACY_LAST_UPDATED" js/constants.generated.js
          grep -q "TERMS_LAST_UPDATED" js/constants.generated.js

      - name: Verify site files can be packaged
        run: |
          mkdir -p _site
          cp index.html privacy-policy.html terms-and-conditions.html .nojekyll _site/
          cp -r css js _site/
          test -f _site/index.html
          test -f _site/js/constants.generated.js

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dynamic last-updated dates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-dates.mjs

      - name: Prepare publishable site
        run: |
          mkdir -p _site
          cp index.html privacy-policy.html terms-and-conditions.html .nojekyll _site/
          cp -r css js _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

  test-summary:
    name: Test run summary
    needs: verify
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Print live URLs
        env:
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          BASE="https://${OWNER}.github.io/${NAME}"
          echo "## Published URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Page | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Home | ${BASE}/ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Privacy Policy | ${BASE}/privacy-policy.html |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terms & Conditions | ${BASE}/terms-and-conditions.html |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "_PR test run: build verified. Site deploys after merge to main/master._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Site published to the \`gh-pages\` branch. Enable Pages once (see README) if not live yet._" >> "$GITHUB_STEP_SUMMARY"
          fi
